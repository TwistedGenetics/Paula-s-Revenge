<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Paula's Revenge app icon: a 90s monitor showing tracker rows (original design) -->
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ecdf"/><stop offset="0.55" stop-color="#ddd5c1"/><stop offset="1" stop-color="#b9b09a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d8571"/><stop offset="1" stop-color="#5e5848"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#1c4a2a"/><stop offset="0.6" stop-color="#0c2414"/><stop offset="1" stop-color="#030a06"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.32" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="lines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#000" opacity="0.28"/>
    </pattern>
    <clipPath id="crt"><rect x="196" y="188" width="632" height="520" rx="92"/></clipPath>
  </defs>

  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bezel)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#a39a83" stroke-width="6"/>
  <!-- screen recess -->
  <rect x="178" y="170" width="668" height="556" rx="108" fill="url(#rim)"/>
  <!-- screen -->
  <g clip-path="url(#crt)">
    <rect x="196" y="188" width="632" height="520" fill="url(#screen)"/>
    <g font-family="DejaVu Sans Mono, Menlo, Courier New, monospace" font-weight="bold" font-size="74" filter="url(#glow)">
      <text x="246" y="290" fill="#86ffa2">C-3 01 0F</text>
      <text x="246" y="380" fill="#86ffa2" opacity="0.45">--- -- --</text>
      <text x="246" y="560" fill="#86ffa2" opacity="0.45">--- -- --</text>
      <text x="246" y="650" fill="#86ffa2">G-3 02 C0</text>
    </g>
    <!-- red play line -->
    <rect x="196" y="414" width="632" height="96" fill="#ff3434" filter="url(#glow)"/>
    <text x="246" y="488" font-family="DejaVu Sans Mono, Menlo, Courier New, monospace" font-weight="bold" font-size="74" fill="#ffffff">F-3 01 0F</text>
    <!-- scanlines -->
    <rect x="196" y="188" width="632" height="520" fill="url(#lines)"/>
    <rect x="196" y="188" width="632" height="520" fill="url(#glass)"/>
  </g>
  <!-- front panel: slot and power light -->
  <rect x="300" y="790" width="290" height="30" rx="15" fill="#8f8772"/>
  <rect x="306" y="794" width="278" height="12" rx="6" fill="#6f6855"/>
  <circle cx="724" cy="805" r="26" fill="#ff3434"/>
  <circle cx="716" cy="797" r="9" fill="#ffffff" opacity="0.55"/>
</svg>
