name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Engine tests
        run: ./build/prv_engine_test

      - name: Package
        run: |
          set -e
          ART="build/PaulasRevenge_artefacts/Release"
          OUT="dist/Paulas-Revenge"
          mkdir -p "$OUT"
          cp -R "$ART/Standalone/Paula's Revenge.app" "$OUT/"
          cp -R "$ART/VST3/Paula's Revenge.vst3" "$OUT/"
          cp -R "$ART/AU/Paula's Revenge.component" "$OUT/"
          # ad-hoc signatures so Apple Silicon will load them
          for b in "$OUT/Paula's Revenge.app" "$OUT/Paula's Revenge.vst3" "$OUT/Paula's Revenge.component"; do
            codesign --force --deep --sign - "$b"
          done
          cp INSTALL.txt "$OUT/"
          cd dist && ditto -c -k --keepParent Paulas-Revenge Paulas-Revenge-macOS-arm64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Paulas-Revenge-macOS-arm64
          path: dist/Paulas-Revenge-macOS-arm64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Paula''s Revenge build {0}', github.run_number) }}
          prerelease: ${{ ! startsWith(github.ref, 'refs/tags/') }}
          files: dist/Paulas-Revenge-macOS-arm64.zip
          body: |
            Apple Silicon build of Paula's Revenge: standalone app, VST3 and AU in one zip.
            See INSTALL.txt inside the zip.
