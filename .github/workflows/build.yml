name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish a GitHub Release

jobs:
  macos:
    name: macOS universal (Standalone + VST3 + AU)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Engine tests
        run: ./build/prv_engine_test

      - name: Ad-hoc sign
        run: |
          ART="build/PaulasRevenge_artefacts/Release"
          codesign --force --deep --sign - "$ART/Standalone/Paula's Revenge.app"
          codesign --force --deep --sign - "$ART/VST3/Paula's Revenge.vst3"
          codesign --force --deep --sign - "$ART/AU/Paula's Revenge.component"

      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/PaulasRevenge_artefacts/Release/AU/Paula's Revenge.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i twisted || true
          auval -strict -v aumu PlRv Twgn

      - name: Validate VST3 (pluginval)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 7 --validate-in-process \
            --validate "build/PaulasRevenge_artefacts/Release/VST3/Paula's Revenge.vst3"

      - name: Package
        run: |
          ART="build/PaulasRevenge_artefacts/Release"
          mkdir -p dist
          ditto "$ART/Standalone/Paula's Revenge.app" "dist/Paula's Revenge.app"
          ditto "$ART/VST3/Paula's Revenge.vst3" "dist/Paula's Revenge.vst3"
          ditto "$ART/AU/Paula's Revenge.component" "dist/Paula's Revenge.component"
          cp INSTALL.txt dist/
          cp docs/screenshot.png dist/ 2>/dev/null || true
          cd dist && ditto -c -k --keepParent . ../PaulasRevenge-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PaulasRevenge-macOS
          path: PaulasRevenge-macOS.zip

      # Every green build of main becomes a downloadable Release
      # (repo front page -> Releases), so there's no digging in Actions.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^project(PaulasRevenge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" PaulasRevenge-macOS.zip \
            --target "${{ github.sha }}" \
            --title "Paula's Revenge ${VERSION} (build ${{ github.run_number }})" \
            --latest \
            --notes "$(git log -1 --pretty=%B)

          Install: unzip, then follow INSTALL.txt (app into Applications, .vst3 and .component into your plug-in folders, clear quarantine, rescan in Ableton)."
