name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish a GitHub Release

jobs:
  macos:
    name: macOS universal (standalone app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release -j 4 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          # as annotations, so they can be read without the full log
          grep -E "error:|Error [0-9]|undefined symbol" build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Engine tests
        run: ./build/prv_engine_test

      # Signed with a Developer ID and notarised when the repo has the secrets (see docs/SIGNING.md);
      # otherwise ad-hoc, as before (INSTALL.txt then tells you how to clear the quarantine)
      - name: Sign (and notarise)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/PaulasRevenge_artefacts/Release/Standalone/Paula's Revenge.app"
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "No Developer ID secrets: ad-hoc signing"
            codesign --force --deep --sign - "$APP"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KCPASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp --entitlements Packaging/Entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarise.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$APP"
            spctl --assess --type execute --verbose "$APP"
          else
            echo "Signed, but no notarisation secrets: not notarised"
          fi

      - name: Check the app starts
        run: |
          APP="build/PaulasRevenge_artefacts/Release/Standalone/Paula's Revenge.app/Contents/MacOS/Paula's Revenge"
          test -x "$APP"
          file "$APP" | grep -q arm64
          file "$APP" | grep -q x86_64

      - name: Package
        run: |
          ART="build/PaulasRevenge_artefacts/Release"
          mkdir -p dist
          ditto "$ART/Standalone/Paula's Revenge.app" "dist/Paula's Revenge.app"
          cp INSTALL.txt dist/
          cp docs/screenshot.png dist/ 2>/dev/null || true
          cd dist && ditto -c -k --keepParent . ../PaulasRevenge-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PaulasRevenge-macOS
          path: PaulasRevenge-macOS.zip

  windows:
    name: Windows x64 (standalone app)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      # the Visual Studio compiler, driven by Ninja (MSBuild trips over the ' in "Paula's Revenge")
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        # the C++ runtime built in (MultiThreaded): no Visual C++ redistributable needed on the PC
        run: |
          set -o pipefail
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded 2>&1 | tee configure.log

      - name: Build
        run: |
          set -o pipefail
          cmake --build build -j 4 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          set +e +o pipefail
          { grep -A4 "CMake Error" configure.log; grep -iE "error [A-Z]+[0-9]+|error LNK|unresolved external|fatal error" build.log | sed 's/\[[^]]*vcxproj\]//' | sort -u; } 2>/dev/null | head -50 > errors.txt
          if [ ! -s errors.txt ]; then tail -30 build.log > errors.txt; fi
          while IFS= read -r line; do echo "::error::${line}"; done < errors.txt
          exit 0

      - name: Engine tests
        run: ./build/prv_engine_test.exe

      # Signed with your code-signing certificate when the repo has the secrets (see docs/SIGNING.md)
      - name: Sign
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          EXE="build/PaulasRevenge_artefacts/Release/Standalone/Paula's Revenge.exe"
          if [ -z "$WINDOWS_CERT_PFX" ]; then echo "No code-signing secrets: not signed"; exit 0; fi
          echo "$WINDOWS_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          signtool.exe sign /f "$RUNNER_TEMP/cert.pfx" /p "$WINDOWS_CERT_PASSWORD" /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "Paula's Revenge" "$EXE"
          signtool.exe verify /pa "$EXE"
          rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Package
        run: |
          ART="build/PaulasRevenge_artefacts/Release/Standalone"
          test -f "$ART/Paula's Revenge.exe"
          mkdir -p "dist/Paula's Revenge"
          cp "$ART/Paula's Revenge.exe" "dist/Paula's Revenge/"
          cp INSTALL-Windows.txt "dist/Paula's Revenge/INSTALL.txt"
          cd dist && 7z a -tzip ../PaulasRevenge-Windows.zip "Paula's Revenge" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: PaulasRevenge-Windows
          path: PaulasRevenge-Windows.zip

  # Every green build of main becomes one downloadable Release with both
  # (repo front page -> Releases), so there's no digging in Actions.
  release:
    name: Release (Mac + Windows)
    needs: [macos, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^project(PaulasRevenge VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          TAG="v${VERSION}-build.${{ github.run_number }}"
          gh release create "$TAG" dist/PaulasRevenge-macOS.zip dist/PaulasRevenge-Windows.zip \
            --target "${{ github.sha }}" \
            --title "Paula's Revenge ${VERSION} (build ${{ github.run_number }})" \
            --latest \
            --notes "$(git log -1 --pretty=%B)

          Mac: unzip, then follow INSTALL.txt (app into Applications, clear quarantine).
          Windows: unzip, run Paula's Revenge.exe (first time: More info -> Run anyway). See INSTALL.txt inside."
